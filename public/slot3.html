<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>3개 맞추기</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#2b1f4a,#0b0a16 70%);color:#fff;font-family:system-ui,"Malgun Gothic",sans-serif;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
h1{margin:14px 0 4px;font-size:26px}
.bal{font-size:18px;background:#0008;border:2px solid #ffd24a;border-radius:99px;padding:6px 18px;margin:6px 0}
.bal b{color:#ffd24a}
.main{display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px}
.betbox{display:flex;flex-direction:column;align-items:center;gap:6px;background:#0007;border-radius:16px;padding:12px 14px}
.betbox .lbl{font-size:13px;opacity:.8}
.betbox .val{font-size:20px;font-weight:900;color:#ffd24a;min-width:110px;text-align:center}
.arrow{width:54px;height:40px;border-radius:10px;border:2px solid #678;background:#243;color:#fff;font-size:22px;cursor:pointer}
.arrow:active{transform:scale(.94)}
#bet{-webkit-appearance:slider-vertical;appearance:slider-vertical;writing-mode:vertical-lr;direction:rtl;width:40px;height:200px;accent-color:#ffd24a;cursor:pointer}
.mark{font-size:11px;opacity:.7}
.go{margin:10px 0;padding:14px 46px;font-size:24px;font-weight:900;border:0;border-radius:14px;background:linear-gradient(#ffd24a,#e08a00);color:#2a1500;cursor:pointer;box-shadow:0 5px 0 #8a4f00}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #8a4f00}.go:disabled{filter:grayscale(.8);opacity:.6}
.pay{background:#0007;border-radius:14px;padding:10px 16px;font-size:16px;line-height:1.7;min-width:170px}
.pay h3{margin:0 0 4px;font-size:15px;color:#ffd24a}
#msg{min-height:34px;font-size:20px;font-weight:800;text-align:center;margin:4px 10px}
.refill{display:none;margin:6px;padding:10px 20px;border-radius:10px;border:0;background:#2e8b57;color:#fff;font-size:16px;font-weight:800;cursor:pointer}
.back{margin:14px;color:#9ab;font-size:13px}
.fx{position:fixed;inset:0;z-index:50;pointer-events:none;display:none}

.reels{display:flex;gap:10px;background:linear-gradient(#5a1d1d,#2a0a0a);padding:16px;border-radius:20px;border:4px solid #ffd24a;box-shadow:0 0 30px #ffd24a55}
.reel{width:min(24vw,104px);height:min(24vw,104px);background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:min(14vw,64px);box-shadow:inset 0 0 14px #0008;overflow:hidden}
.reel.spin{animation:blur .12s infinite}@keyframes blur{50%{filter:blur(2px)}}
.reel.hit{animation:pop .5s 3}@keyframes pop{50%{transform:scale(1.15);background:#fff6b0}}
.pay .r{display:flex;justify-content:space-between;gap:14px;font-size:15px}
#skull{background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:99}
#skull .s{font-size:min(60vw,300px);animation:shake .1s infinite;filter:drop-shadow(0 0 30px red)}
#skull .t{color:#c00;font-size:28px;font-weight:900;letter-spacing:4px;margin-top:10px}
@keyframes shake{25%{transform:translate(4px,-3px) rotate(2deg)}75%{transform:translate(-4px,3px) rotate(-2deg)}}
#jp{display:none;z-index:98;background:rgba(0,0,0,.35)}
#jp .t{position:absolute;left:0;right:0;top:20%;text-align:center;font-size:min(16vw,90px);font-weight:900;background:linear-gradient(#fff6a0,#ffb300,#ff5a00);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #ffd24a);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.fnt{position:absolute;bottom:-60px;font-size:36px;animation:fly 2.4s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(var(--dx),var(--up)) rotate(180deg)}100%{transform:translate(calc(var(--dx)*1.4),30px) rotate(360deg);opacity:.2}}
.flash{animation:fl .3s 6}@keyframes fl{50%{background:#fff3}}
</style></head><body>
<h1>🎰 3개 맞추기</h1><div class="bal" id="bal"></div>
<div class="main">
 <div class="reels"><div class="reel" id="r0">❔</div><div class="reel" id="r1">❔</div><div class="reel" id="r2">❔</div></div>
 <div class="pay"><h3>배당</h3>
  <div class="r"><span>😀 2개</span><b>0.7배</b></div><div class="r"><span>😀 3개</span><b>2배</b></div>
  <div class="r"><span>❤️ 2개</span><b>1.5배</b></div><div class="r"><span>❤️ 3개</span><b>3배</b></div>
  <div class="r"><span>7️⃣ 2개</span><b>5배</b></div><div class="r"><span>7️⃣ 3개</span><b>50배 JACKPOT</b></div>
  <div class="r"><span>💀 1~2개</span><b>없음</b></div><div class="r"><span>💀 3개</span><b>전부 잃음</b></div></div>
 <div class="betbox"><div class="lbl">▲ 최대 1억</div><button class="arrow" id="up">▲</button><input type="range" id="bet" min="0" step="1"><button class="arrow" id="dn">▼</button><div class="lbl">▼ 최소 10만</div><div class="val" id="bv"></div><div class="mark">내기 금액</div></div>
</div>
<div id="msg"></div><button class="go" id="go">돌리기!</button><button class="refill" id="refill">💰 칩이 없어요! 충전</button>
<div class="back">가상 칩 전용 · 현금 가치 없음 · 게임 칩과 같은 잔액</div>
<div class="fx" id="skull"><div class="s">💀</div><div class="t">모든 것을 잃었다...</div></div>
<div class="fx" id="jp"><div class="t">JACKPOT!!</div></div>
<script>
const $=s=>document.querySelector(s);
const OPT=[];for(let v=10;v<=100;v+=10)OPT.push(v*10000);for(let v=200;v<=1000;v+=100)OPT.push(v*10000);for(let v=2000;v<=10000;v+=1000)OPT.push(v*10000);
let bal=0;let busy=false;
const fmt=n=>{if(n>=100000000){const e=Math.floor(n/1e8),m=Math.floor(n%1e8/1e4);return e+'억'+(m?' '+m.toLocaleString()+'만':'')}return n>=10000?Math.floor(n/10000).toLocaleString()+'만':n.toLocaleString()};
function save(){}
async function mini(game,bet){try{const r=await fetch('/api/mini',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:localStorage.getItem('pk_token')||'',game,bet})});return await r.json()}catch(e){return{err:'서버 연결 실패'}}}
function push(c){try{parent.postMessage({t:'chips',chips:c},'*')}catch(e){}}
async function sync(){const j=await mini('info',0);if(j.err){$('#msg').textContent=j.err;$('#go').disabled=true;return}bal=j.chips;showBal()}
function showBal(){$('#bal').innerHTML='🪙 <b>'+fmt(bal)+'</b> 칩';$('#refill').style.display=bal<20000?'inline-block':'none'}
function betVal(){return OPT[+$('#bet').value]}
function showBet(){$('#bv').textContent=fmt(betVal())}
function step(d){if(busy)return;const e=$('#bet');e.value=Math.max(0,Math.min(OPT.length-1,+e.value+d));showBet()}
$('#bet').max=OPT.length-1;$('#bet').value=9;$('#bet').oninput=()=>{if(!busy)showBet();else showBet()};
$('#up').onclick=()=>step(1);$('#dn').onclick=()=>step(-1);
$('#refill').onclick=async()=>{try{const r=await fetch('/api/refill',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:localStorage.getItem('pk_token')||''})});const j=await r.json();$('#msg').textContent=j.err||'💰 칩이 충전되었습니다'}catch(e){}await sync();push(bal)};
showBet();sync();
/* 소리 */
let AC=null;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function tone(f,t,d,type,vol,fe){const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,a.currentTime+t);if(fe)o.frequency.exponentialRampToValueAtTime(fe,a.currentTime+t+d);g.gain.setValueAtTime(vol||.2,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+d+.05)}
function noise(t,d,vol){const a=ac(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=vol||.2;s.connect(g);g.connect(a.destination);s.start(a.currentTime+t)}
const sndWin=()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.1,.25,'triangle',.25));
const sndBig=()=>[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,i*.09,.4,'triangle',.28));
const sndLose=()=>tone(200,0,.5,'sawtooth',.15,90);
const sndTick=()=>tone(900,0,.04,'square',.06);
function sndSpooky(){tone(60,0,3,'sawtooth',.25,35);tone(62,0,3,'sine',.3,30);[400,380,360].forEach((f,i)=>tone(f,i*.5,1,'sine',.08,f*.5));noise(1.2,1.6,.25);tone(1800,1.0,.6,'sawtooth',.05,300)}
function sndJackpot(){[523,659,784,1047,1319,1568,2093].forEach((f,i)=>tone(f,i*.08,.5,'square',.14));[0,.5,1,1.5,2].forEach(t=>{tone(784,t+.7,.18,'triangle',.25);tone(1047,t+.85,.3,'triangle',.25)});noise(.6,2,.12)}


const SY=[{e:'😀',w:50,m2:.7,m3:2},{e:'❤️',w:30,m2:1.5,m3:3},{e:'7️⃣',w:10,m2:5,m3:50},{e:'💀',w:10,m2:0,m3:0}];
function pick(){let r=Math.random()*100,c=0;for(const s of SY){c+=s.w;if(r<c)return s}return SY[0]}
const reels=[0,1,2].map(i=>$('#r'+i));
function jackpotFx(){const f=$('#jp');f.style.display='block';sndJackpot();document.body.classList.add('flash');
 const go=()=>{for(let i=0;i<14;i++){const e=document.createElement('div');e.className='fnt';e.textContent='7️⃣';e.style.left=(8+Math.random()*84)+'%';e.style.setProperty('--dx',(Math.random()*160-80)+'px');e.style.setProperty('--up',-(innerHeight*(.5+Math.random()*.4))+'px');e.style.animationDelay=Math.random()*.5+'s';f.appendChild(e);setTimeout(()=>e.remove(),3200)}};
 go();const iv=setInterval(go,700);setTimeout(()=>{clearInterval(iv);f.style.display='none';document.body.classList.remove('flash')},5200)}
function skullFx(){const f=$('#skull');f.style.display='flex';sndSpooky();setTimeout(()=>f.style.display='none',3200)}
$('#go').onclick=async()=>{if(busy)return;busy=true;$('#go').disabled=true;ac();const bet=betVal();$('#msg').textContent='';
 const j=await mini('slot',bet);if(j.err){$('#msg').textContent=j.err;fin();return}
 bal=j.before-bet;showBal();push(bal);
 const res=j.reels.map(k=>SY[k]);reels.forEach(r=>{r.classList.remove('hit');r.classList.add('spin')});
 const all=SY.map(s=>s.e);const ivs=reels.map(r=>setInterval(()=>{r.textContent=all[Math.floor(Math.random()*4)];sndTick()},80));
 reels.forEach((r,i)=>setTimeout(()=>{clearInterval(ivs[i]);r.classList.remove('spin');r.textContent=res[i].e;tone(500+i*150,0,.12,'square',.12);if(i===2)settle(res,bet,j)},900+i*600))};
function settle(res,bet,j){
 const cnt={};res.forEach(s=>cnt[s.e]=(cnt[s.e]||0)+1);
 let top=SY.find(s=>cnt[s.e]===3),two=SY.find(s=>cnt[s.e]===2);
 const hit=e=>reels.forEach((r,i)=>{if(res[i].e===e)r.classList.add('hit')});
 const done=()=>{bal=j.after;showBal();push(bal);fin()};
 if(top&&top.e==='💀'){hit('💀');$('#msg').innerHTML='💀💀💀 해골 3개... 전 재산을 잃었습니다';skullFx();setTimeout(done,3400);return}
 let m=0,txt='';
 if(top){m=top.m3;hit(top.e);txt=top.e+top.e+top.e+' 3개! '+m+'배'}
 else if(two&&two.e!=='💀'){m=two.m2;hit(two.e);txt=two.e+' 2개! '+m+'배'}
 else txt='꽝...';
 if(top&&top.e==='7️⃣'){$('#msg').innerHTML='🎉 JACKPOT!! 777 +'+fmt(bet*m);jackpotFx();setTimeout(done,5300);return}
 if(m>=3)sndBig();else if(m>=1)sndWin();else sndLose();
 const net=Math.round(bet*m)-bet;
 $('#msg').innerHTML=txt+(m?' → '+(net>=0?'+':'-')+fmt(Math.abs(net)):'');done()}
function fin(){busy=false;$('#go').disabled=false}
</script></body></html>
